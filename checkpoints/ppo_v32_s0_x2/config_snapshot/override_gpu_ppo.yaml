# 学習環境を Rust 版にし、並列 1,024・ミニバッチ 16,384 で PPO を GPU で回す。
# 2026-10-18 の比較（v20a_s1 の 660 万ステップから 500 万ステップ、4 本同時、dev の Seed 100 エピソード、確率的）:
#   今の設定（16 並列、n_steps 1024、batch 256、CPU）: 25 分、Stage 4/6/7/8 = 0.64/0.75/0.97/0.85
#   この設定: 4.3 分、0.96/0.80/0.98/0.89（256 並列・batch 8,192 と 1,024 並列・batch 4,096 も同程度で、この設定が最速）
# 学習率・エポック数などは変えていない。Seed 1 本の比較（Stage 6〜8 の差は誤差の範囲）。他の値との比較は未実施
rl:
  ppo:
    n_steps: 64
    batch_size: 16384
  training:
    n_envs: 1024
    device: cuda
    env_backend: native
    # 6 本同時に学習する（32 スレッド ÷ 6）。1 本ずつなら 32。スレッドの数の比較は未実施
    # 結果は変えずに更新を速くする（rl.yaml の fast_ppo）
    fast_ppo: true
    env_threads: 5
    # 1 本 約 1.2 万 steps/s で約 7 分ごと。20 万（rl.yaml）のままでは 16 秒ごとに 1.5 MB を保存し、1 億ステップで
    # 500 個・750 MB になって、2026-10-19 にディスクを埋めて学習が止まった。評価は 2,000 万ステップごとなので足りる
    checkpoint_every_steps: 5000000
