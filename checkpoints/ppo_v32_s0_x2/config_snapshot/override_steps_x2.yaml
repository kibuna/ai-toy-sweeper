# v33（2026-10-22）: 8 Hz（robot_8hz・hw_1022）の歩数の上限を 2 倍にする。
# - 元の 300 + 150 / 個（config/task.yaml）は 4 Hz・1 歩 2 cm・0.8 m 四方で決めた値で、時間にすると 75 s + 37.5 s / 個。
#   8 Hz にしたとき「1 歩の意味が同じ」として歩数をそのまま残したので、時間は半分（37.5 s + 18.75 s / 個）になっていた。
# - 実測の速さ（hw_1022）では 1 歩が 1.8 cm・0.344 rad（20°）で、元の 2 cm・0.25 rad より前進は短く旋回は粗い。作業領域も
#   最大 1.0 m（元は 0.8 m）。要る歩数は距離だけで 1.1 × 1.25 ≒ 1.4 倍、向きの合わせ直しでさらに増える。
# - 評価だけで上限を変えた比べ（v32 s0・s1 の最後、実機の大きさ、300 回）:
#   時間切れは 1 倍 / 1.5 倍 / 2 倍で Stage 8 が 42・37 → 25・33 → 20・17、Stage 9 が 45・54 → 31・37 → 31・36。
#   2 倍で Stage 7・8 の時間切れの多くが成功に変わる。2 倍より上（2.5、3 倍）は比べていない（未検証）。
# - 実機では 1 個 75 s、5 個 225 s まで待つ（field/runtime.py の max_steps も config_snapshot のこの値を使う）
task:
  episode:
    max_steps: 600
    max_steps_per_extra_target: 300
