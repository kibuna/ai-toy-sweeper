# v30（2026-10-22）: 作業領域を盤面ごとの自由な大きさの長方形にし、
# 壁を置かない。実機の作業領域は手で置いたマーカーの長方形（カメラの校正で 74.8 × 82.6 cm）で、置くたびに大きさが変わる
sim:
  walls:
    enabled: false
    # 外へ 0.10 m までは失敗にしない（出ただけで失敗にする必要はなく、取り戻せないほど遠くへ行くのを防げばよい）。
    # C920 がカメラの校正の位置から映す範囲の粗い見積もりで、いちばん狭い手前の縁の外が約 0.12 m。その内側（未検証。
    # 校正した姿勢から、作業領域を 0.10 m 広げた長方形が画像に入るかを MacBook で確かめる）
    out_of_area_margin_m: 0.10
task:
  reward:
    # 2026-10-22 に足した（v31 から。v30 は 5 のまま学習し、方策がわざと外へ出て終わらせた: 学習中の成功率 0.92 → 0.4〜0.5
    # で報酬は −5 → +3 に上がり、評価で 300 回中 150〜290 回が外へ出て失敗）。壁なしでは失敗に届くので、止まり続けの価値
    # −time_penalty / (1 − γ)（efficient の 0.1 と γ 0.99 で −10）より重くする。その 2 倍の 20（比べたことはない、未検証）
    failure_penalty: 20.0
  sampling:
    # 幅・奥行きとも 0.6〜1.0 m（2026-10-22 に決めた。家の床に置けそうな範囲で、今の実機 0.748 × 0.826 m も入る）
    work_area_size_range_m: [[0.6, 1.0], [0.6, 1.0]]
  observation:
    area_size: true
