[package]
name = "toy_sweeper_native"
version = "0.1.0"
edition = "2021"
description = "おもちゃ片付けの学習環境の Rust 版"

[lib]
name = "toy_sweeper_native"
crate-type = ["cdylib", "rlib"]

[features]
# maturin がビルドするときだけ有効（cargo test は libpython にリンクして動かす）
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.25"
numpy = "0.25"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = 1
