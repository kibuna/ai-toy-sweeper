# v34（押し込まない学習、2026-10-23）: 全対象が入れば成功・終わりにして学習し、終わったときに
# 残っている直すべき物（ゴールの中の対象外・置き場から出た対象外）を 1 個 5 減点する。
# - 上限 2 倍の v32 s0 の時間切れの 8 割は、運ぶときに一緒に押し込んだ対象外を出せずに止まっていた。両方を入れる
#   （届いたら終わり + 押し込まない学習）。foreign_in_goal・home_out はポテンシャルで終端に戻るので、届いたら終わりの
#   学習では押し込んでも損がない。その分を終わりに残す。
# - 5: 時間の罰 0.1 の 50 歩分。重いほど押し込まないが、成功（+10）− 残り × 減点 が止まり続けの価値（−0.1 / (1 − 0.99)
#   = −10）を下回ると、入れ切らずに止まる方が得になる（v30 のわざと外へ出る癖と同じ形）。10 では残り 2 個で −10 と並ぶ。
#   5 なら残り 3 個（時間切れの調べの最大）でも −5 で上。他の値とは比べていない（未検証）。
task:
  success:
    require_cleanup: false
  reward:
    leftover_penalty: 5.0
    # efficient.yaml（v28、学習で重ねる）と同じ。上の 5 は時間の罰 0.1 を前提に決めたので、単独で読んでも成り立つよう書く
    time_penalty: 0.1
