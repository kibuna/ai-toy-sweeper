# カメラの校正と ArUco のマーカー（doc/camera_setup.md）。2026-10-18、実機のカメラが届いたので決めた。
#
# 床の座標: 作業領域（校正で決まる長方形）の中心が原点、x は右、y は奥（カメラから遠い方）。
# 「手前」= カメラに近い辺（y が負の辺）。下の 4 隅の座標の例は 0.8 m 四方のとき。

field:
  # 床の 4 隅と、ロボットの上のマーカー。4×4 は 1 マスが大きく、遠く・斜めからでも読みやすい（50 個あれば足りる）
  dictionary: DICT_4X4_50
  # 黒い四角の 1 辺（印刷して定規で確かめる）。2026-10-18、Gazebo の斜め上のカメラ（手前の辺から 0.45 m、高さ 0.8 m、
  # 画角 70°）で、1280×720 では奥の 2 つが潰れて（縦 約 20 px）読めず、1920×1080（実機のカメラ）なら読めた
  # （カメラの位置のずれ 2 mm、再投影誤差 1.1 px）。8 cm でも結果は同じ。印刷済みの 6 cm を使う。720p のカメラなら大きくする
  corner_marker_size_m: 0.06
  # 作業領域の角ごとの ID。印刷した紙を線（黒い四角の paper_margin_m 外側）で切って置く（向きは問わない）。
  # - 奥の 2 つ: 作業領域の内側の角。紙の 2 辺を角の 2 辺（壁かテープの線）に押し当てる。
  # - 手前の 2 つ: 手前の壁の外側（カメラ側）。紙の角を壁の外側の角に合わせ、紙の 1 辺を手前の壁の外側の面に押し当てる
  #   （壁が無ければ、紙の角を作業領域の角に合わせ、手前へはみ出させる）。壁の厚みは sim.yaml の walls.thickness_m。
  # 2026-10-18: 4 つとも外側だと奥が、4 つとも内側だと手前が、壁（高さ 5 cm）の陰に隠れた（斜め上のカメラ、Gazebo）
  paper_margin_m: 0.005
  # 実機の手前の壁の厚み（手前のマーカーの位置の計算に使う）。2026-10-18: 実機でははっきりした壁を置かず、
  # 自由な領域の四隅にマーカーを置くかもしれない → 0（壁なし: 紙の角を作業領域の角に合わせる）。壁を置いたら測って書く。
  # Gazebo の画像の校正では、シミュレーションの壁の厚み（sim.yaml walls.thickness_m）を使う
  wall_thickness_m: 0.0
  corner_ids:
    near_left: 0     # x = −0.4, y = −0.4
    near_right: 1    # x = +0.4, y = −0.4
    far_right: 2     # x = +0.4, y = +0.4
    far_left: 3      # x = −0.4, y = +0.4
  # ロボットの上のマーカー。車体の上面 85 mm 角に収まる大きさ（未検証）。印刷の大きさは実測で 50 mm（2026-10-22）
  robot_id: 4
  robot_marker_size_m: 0.05
  # マーカーの中心の、車軸の中点からの位置（ロボットの座標: x は前、y は左）。2026-10-22 16:20 に付け直した: 車軸の中点の
  # 真上（実測）。前は後ろへ 15 mm・高さ 40 mm で、立てた micro:bit の陰に隠れて回るときに読めなかった
  robot_marker_offset_m: [0.0, 0.0]
  # マーカーの面の床からの高さ。2026-10-22 16:20 実測 65 mm（micro:bit の上端より上）。斜め上のカメラでは、高さを使わないと
  # 位置が 1 cm 以上ずれる（test/test_robot_marker.py）。マーカーの向き（ロボットの前とのずれ）は貼り方で決まるので、
  # 走らせて測り data/calibration/robot_marker.yaml に置く（scripts/measure_motion.py yaw）
  robot_marker_height_m: 0.065

intrinsics:
  # カメラの内部パラメータ（焦点距離、歪み）を求めるボード。床のマーカーと取り違えないよう別の辞書にする
  dictionary: DICT_5X5_100
  squares: [6, 8]            # 横 × 縦のマス
  square_size_m: 0.025       # A4 に 150 × 200 mm で収まる
  marker_size_m: 0.018       # マスの 7 割強（OpenCV の例と同じ程度）
