# 指示文の根拠検査（toy_sweeper.task_manager.check_grounding）に使う語彙。
# VLM が選んだ値は、ここにある語のどれかが指示文に含まれていなければならない（含まれなければ止める）。
# 指示文に現れた語の値は、すべて VLM の出力に使われていなければならない（行き先が 2 つ等を止める）。
# 2026-10-16、Qwen3-VL が対応外の指示（「ぬいぐるみを右に」「床を拭いて」）にも、もっともらしい JSON を返したため追加。
# 語彙にない言い換えは止まる側に倒れる（安全側）。語の追加は評価データで確かめてから行う
classes:
  lego: ["レゴ", "LEGO", "lego", "ブロック", "brick"]
  toy_car: ["ミニカー", "車", "くるま", "toy car", "car"]
# 種類をまとめて指す語。これが文中にあれば target_classes に全種類が入ってよい
all_classes: ["おもちゃ", "toy"]
colors:
  red: ["赤", "red"]
  blue: ["青", "blue"]
  yellow: ["黄", "yellow"]
  green: ["緑", "green"]
  white: ["白", "white"]
  black: ["黒", "black"]
  # 2026-10-18、実物のおもちゃにある色。「黄緑」は黄色・緑と数えない（長い語を先に照合、task_manager._mentions）
  lime: ["黄緑", "lime", "yellow green"]
  light_blue: ["水色", "light blue", "sky blue"]
  pink: ["ピンク", "桃色", "pink"]
  orange: ["オレンジ", "橙", "orange"]
# 四隅（2026-10-16）。「奥」はカメラ画像の上（部屋の奥）を仮定（config/prompts/README.md）
destinations:
  top_left: ["左上", "左奥", "top left", "upper left"]
  top_right: ["右上", "右奥", "top right", "upper right"]
  bottom_left: ["左下", "左手前", "bottom left", "lower left"]
  bottom_right: ["右下", "右手前", "bottom right", "lower right"]
  # 2026-10-18 に足した。「右上」の「上」「右」は数えない（長い語を先に照合）
  top: ["上", "奥", "top"]
  bottom: ["下", "手前", "bottom"]
  left: ["左", "left"]
  right: ["右", "right"]
# ひらがなの言い方を、VLM に渡す前に置き換える表記（2026-10-18）。5 歳くらいの子どもが使う。
# Qwen3-VL 4B は、ひらがなの「みぎした」を右上、「れご」をミニカーと読み違えた（14 件中 6 件）。
# 長い言葉から先に置き換える。部分一致なので「あかちゃん」は「赤ちゃん」になる（種類・行き先の根拠にはならず無害）。
# 「しろ」は入れない（「うしろ」が「う白」になる）。白は「しろい」だけ
kana:
  ひだりの うえ: 左上
  みぎの うえ: 右上
  ひだりの した: 左下
  みぎの した: 右下
  ひだりのうえ: 左上
  みぎのうえ: 右上
  ひだりのした: 左下
  みぎのした: 右下
  ぶーぶー: ミニカー   # 幼児語で車
  くるま: 車           # ひらがなのままでは、VLM が「くるまは そのままで」を運ぶ対象にも入れた
  きみどり: 黄緑
  みずいろ: 水色
  ぴんく: ピンク
  おれんじ: オレンジ
  ひだりうえ: 左上
  みぎうえ: 右上
  ひだりした: 左下
  みぎした: 右下
  れご: レゴ
  ぶろっく: ブロック
  みにかー: ミニカー
  あかい: 赤い
  あおい: 青い
  きいろい: 黄色い
  みどりの: 緑の
  しろい: 白い
  くろい: 黒い
  あか: 赤
  あお: 青
  きいろ: 黄色
  みどり: 緑
  くろ: 黒
  うえ: 上     # 長い語（ひだりうえ など）を先に置き換えるので、「みぎうえ」はここに来ない
  した: 下
  ひだり: 左
  みぎ: 右
