# タスク（Stage ごとの初期配置、終了条件、報酬）。

control:
  # 初期値。カメラ 5〜10 fps で毎 Action 再観測できる周期（4 Hz）。
  # 0.1 / 0.5 s との比較は未実施（未検証）。
  action_duration_s: 0.25

episode:
  # 必要歩数の見積もり: 接近 0.6 m + 押し 0.4 m = 50 前進 + 旋回 20 程度 ≒ 70〜100 歩。
  # 回り込みの余裕を 3 倍見て 300 歩（75 秒）。未検証。
  max_steps: 300
  # 対象が 1 個増えるごとに足すステップ数（v7）。v6 の Stage 6 で成功時の平均が 60〜80 ステップだったので、その 2 倍
  max_steps_per_extra_target: 150

observation:
  # Observation v2 で渡す対象外物体の数（ロボットに近い順）。clutter_range の最大 8 より少ない 6 は
  # 「遠い物体は当面の衝突に関係しない」という仮定による。4 / 8 との比較は未実施（未検証）
  n_obstacle_slots: 6
  # v7: 主対象以外の対象を渡す数。Stage 7 の対象の最大 5 個から主対象を除いた 4（全部渡せる）
  n_target_slots: 4
  # v9: 「主対象を挟んでいる」とみなす範囲。閉じた爪の中央（梁の中央）から左右これ以内、前後は梁の根元の手前から先端まで。
  # LEGO の短辺の半分 8 mm より少し大きい。観測した位置から計算するので、実機の追跡のずれ（シミュレーションで 7〜16 mm）
  # を考えると狭すぎる可能性がある（未検証）
  held_lateral_tolerance_m: 0.012
  # 隠れ（v21）: 仮想の斜め上のカメラから見て、車体の陰に入った物体と閉じた爪の間の物体は、最後に見えた位置の
  # まま観測する（現場の追跡が最後の位置を保つのと同じ）。既定は無効、v21 で有効（config/experiments/imperfect.yaml）。
  # カメラの位置は Gazebo の斜め上のカメラ（config/experiments/gazebo_oblique.yaml）と同じ。他の値は perception_oblique.yaml と
  # そろえた（未検証）
  # v25: 縁までの符号付き距離（主対象と各スロット）の測り方。center は中心（v9〜v24 の Policy はこれで学習した）。
  # corners は、成功の条件が 4 隅で決まる物体（置き場を持つ対象外、対象）でいちばん外の角を測る（v25、
  # config/experiments/corner_edge.yaml）。既定は今までの Policy と現場のランタイムに合わせて center（比較は v25、未検証）
  edge_distance: center
  # v26: 全対象が入った後、主対象を直すべき対象外（置き場から出た物体、
  # ゴールの中の置き場を持たない対象外）にし、頭のゴールの欄をその行き先にする。頭に仕事の 3 次元が増える。
  # 既定は今までの Policy に合わせて無効（config/experiments/cleanup_guidance.yaml で有効。比較は v26、未検証）
  cleanup_primary: false
  # v30: 頭の終わりに作業領域の半分の幅・奥行きを position_scale_m で
  # 割った 2 次元を足す。既定は今までの Policy に合わせて無効（config/experiments/free_area.yaml で有効）
  area_size: false
  # 位置・ゴールの大きさ・距離を割る尺度（x, y の半分の長さ）。v29 までは sim.work_area.size_m の半分で割っていた。
  # 作業領域が盤面ごとに変わっても同じ 1 m が同じ値になるよう、v30 で今までの 0.8 m 四方の半分に固定した（v26〜v29 の
  # 重みの意味を保つため。他の値との比較はない）
  position_scale_m: [0.4, 0.4]
  occlusion:
    enabled: false
    camera_xyz_m: [0.0, -0.85, 0.8]
    robot_height_m: 0.045
    margin_m: 0.005
    object_mid_height_m: 0.008
    held_radius_m: 0.025

success:
  # Stage 0 の到達判定。LEGO 短辺 15.8 mm の約 2 倍。未検証。
  reach_tolerance_m: 0.03
  # 対象のある盤面の成功に、ゴールの中の対象外（もともと外にあったもの）が無いことと、置き場から出た対象外が無いことも
  # 求めるか（v9・v18 からの条件。Stage 9 の「やり残し」の直しの学習はこれが前提）。false は全対象が入れば成功
  # （test/configs/targets_only.yaml。2026-10-22 の時間切れの調べで比べたが、残した物を直さずに終えるので、評価と実機は true）
  require_cleanup: true

sampling:
  # 物体と Stage 0 指定点の中心を置ける範囲（作業領域の端からこの距離以上内側）。
  # 対象は選んだゴールの外に置く。ミニカーの半長 33 mm + 余裕。
  object_margin_m: 0.06
  # ロボット中心を置ける範囲（作業領域の端からこの距離以上内側）。車体半対角 0.06 m + 余裕。
  robot_margin_m: 0.1
  # Stage 1: 車体前面と物体中心の距離。押し始めまで 1〜4 歩。
  stage1_front_gap_m: [0.03, 0.08]
  # Stage 1: ゴール方向からの向きのずれ（rad）。約 ±6°
  stage1_yaw_noise_rad: 0.1
  # Stage 2/3: ロボット中心と物体中心の距離
  robot_object_distance_m: [0.12, 0.3]
  # Stage 2: ロボットを置く方向の、物体→ゴールの逆方向からのずれの上限（rad）。π/2 = 後方の半平面
  stage2_max_offset_rad: 1.5707963267948966
  # Stage 5: 作業領域の端から物体中心までの距離。LEGO の半長 16 mm より少し外から 5 cm まで。
  # ロボットが物体の後ろ（端の側）に回るとロボット中心が領域外に出るので、押すだけでは内側へ運べない
  stage5_edge_distance_m: [0.02, 0.05]
  # Stage 5: ロボットを物体の内側に置く距離と、物体の方向からの向きのずれ（rad、約 ±29°）
  stage5_robot_distance_m: [0.12, 0.25]
  stage5_yaw_noise_rad: 0.5
  # Stage 5: ゴールの中心は、物体から見て内側方向（端の内向き法線との角度 60° 以内）に置く
  stage5_goal_max_angle_rad: 1.0471975511965976
  # Stage 6: 対象外の物体の数 [最小, 最大]（両端含む）。最大 + 1 が盤面の物体数の上限
  # 2026-10-16 にブロックを増やした。盤面は最大 15 個
  clutter_range: [2, 14]
  # Stage 6: 対象に他の物体を接して置く確率と、接して置く数の上限（くっついた物体を引き離す練習）
  cluster_probability: 0.3
  cluster_max_neighbors: 2
  # 接して置くときの隙間 [最小, 最大]。0〜5 mm（ほぼ接触）
  cluster_gap_m: [0.0, 0.005]
  # Stage 6: 各物体がミニカーになる確率（残りは LEGO）
  toy_car_probability: 0.3
  # Stage 7・8（複数の対象）の対象の 1 個ずつが、この確率でミニカー（同じ色）になる（v28、2026-10-19 夕方、
  # ミニカーなどをまとめて運べるかの検証）。0 より大きいとき、対象外は対象の色を使わない（指示は
  # 「その色のもの全部」）。0 は今まで（対象は LEGO だけ、乱数も引かない）。検証は config/experiments/multi_toy_car.yaml
  multi_target_toy_car_probability: 0.0
  # Stage 7・8 の 2 個目からの対象を、接して置く（cluster_probability）に当たらなかったとき、この確率で、それまでの
  # 対象の近く（接しない）に置く（v29、2026-10-21、まとめて押す練習）。0 は今まで（乱数も引かない）。
  # 検証は test/configs/target_group.yaml
  target_group_probability: 0.0
  # 近くに置くときの外接円どうしの隙間 [最小, 最大]。下限は object_gap_m（0.01）。上限 3 cm は LEGO 2 個に車体の前面
  # （8.6 cm）と開いた爪（72 mm）で一度に触れる程度（v29 の設計）。未検証
  target_group_gap_m: [0.01, 0.03]
  # v30: 盤面ごとの作業領域の [[幅の下限, 上限], [奥行きの下限, 上限]]（一様乱数、幅 → 奥行きの順に引く）。空は
  # config/sim.yaml の work_area の固定（乱数を引かない）。範囲は config/experiments/free_area.yaml
  work_area_size_range_m: []
  # 物体どうし、物体とロボットの外接円の間に空ける隙間。1 前進 2 cm の半分
  object_gap_m: 0.01
  # ゴールの決め方。zones: config/sim.yaml の goal_zones から 1 つ選ぶ。random: 位置と大きさを乱数で決めた長方形
  # （作業領域内）。任意の搬送先へ汎化させるため（2026-10-16）。学習は random、評価は両方で行う
  goal_mode: random
  # goal_mode: random のときのゴールの幅・高さの範囲。goal_zones の短辺 0.2 m を中心に、ミニカー（65 mm）の
  # 約 2 倍の 0.15 m から 0.3 m。未検証
  random_goal_size_m: [0.15, 0.3]
  # Stage 7: 対象（同じ色の LEGO）の数 [最小, 最大] と、対象外の数 [最小, 最大]（v7）
  stage7_targets: [2, 5]
  stage7_clutter: [2, 10]
  # Stage 8（連続の色分けの 1 回分、v18）: 置き場（他の指示のゴール）の数、置き場ごとの物体の数、
  # 置き場の外の対象外の数 [最小, 最大]。置き場は四隅のゴールの残り 3 つまで。物体の数は色分けデモ（4 色 × 2〜3 個）で、
  # 前の色が入った置き場に 2〜3 個。対象外の上限 13 はデモの盤面（Stage 6 の生成器、物体 10〜15 個、対象 2〜3 個）の
  # 対象外の数の最大。置き場の物体の下限 1 は、少ない場合も含めるため（未検証）
  stage8_zones: [1, 3]
  stage8_zone_objects: [1, 3]
  stage8_clutter: [2, 13]
  # Stage 9（後片付けから始まる盤面、v24）: Stage 8 の盤面に「やり残し」（対象外をゴールに入れてしまった、
  # 置き場の物体を出してしまった、を 1〜2 個）を加える確率。0.5 は半分を普通の Stage 8 の盤面のまま残し、Stage 8 の成績を
  # 落とさないため（設計の値。他の値との比較はない。未検証）
  stage9_mistake_probability: 0.5
  # やり残しを加える盤面のうち、対象を全部ゴールの中に置き直す（運び終えた後の場面）確率。v21L の Stage 8 の失敗の約 3/4 が
  # 全対象を入れた後の後片付けだったので、その場面と、運ぶ途中の場面を半分ずつ（設計の値。比較はない。未検証）
  stage9_all_delivered_probability: 0.5
  # 「出してしまった」物体の中心の、置き場の縁からの距離 [下限, 上限]（m、符号付き距離。正 = 外）。v21L の失敗で置き場から
  # 出た物体の距離 2〜185 mm の大半が入る範囲（設計の値。比較はない。未検証）
  stage9_home_out_m: [0.01, 0.12]
  # v35: 対象を全部ゴールに置き直した盤面で、「入れてしまった」対象外を届けた対象のどれかに接して置く確率（ゴールの中、
  # _neighbor の並べ方）。届けたミニカーに挟まれた LEGO を出す練習。既定 0（今までと同じ、乱数も
  # 引かない）。値は test/configs/wedged.yaml
  stage9_wedged_probability: 0.0
  # v9: 対象外は「4 隅がゴール内」か「外形がゴールからこれ以上離れる」のどちらか。縁にまたがる配置と、ひと押しで入る
  # 縁のすぐ外の配置を除く（レビューで盤面の約 1/4 がゴールの縁 3 cm 以内に対象外を持ち、100% の上限を決めていた）。
  # 3 cm は 1 前進（2 cm）より大きい値（未検証）
  goal_clearance_m: 0.03
  # 拒否サンプリングの上限。超えたら設定が矛盾しているので例外にする
  max_tries: 1000

reward:
  # すべて初期値で未検証。
  progress_per_m: 10.0        # alpha: 対象物（Stage 0 はグリッパー中心）のゴール距離の減少 1 m あたり
  approach_per_m: 2.0         # eta: グリッパー中心の接近点への距離の減少 1 m あたり（alpha より小さく）
  approach_offset_m: 0.04     # 接近点の物体中心からの距離。LEGO 長辺の半分 16 mm + 指の長さの半分 17.5 mm + 余裕
  success_bonus: 10.0         # beta: 全対象がゴールに入ったとき
  # rho: 対象を 1 個ゴールに入れるごとに（出したら同じだけ減点）。
  # 成功報酬の 1/3。対象 1 個のタスクでは成功と同時に入るので、v6 より 1 個あたり 3 だけ高くなる。未検証
  delivery_bonus: 3.0
  # rho_f: もともと外にあった対象外がゴールに入っている 1 個あたりの減点（ポテンシャル。取り出せば戻る）。v9 で
  # 「対象外を入れたら即失敗」をやめた代わり（押し込んでも後で取り出せばよい）。delivery_bonus と同じ大きさ（未検証）
  foreign_in_goal_penalty: 3.0
  failure_penalty: 5.0        # delta: 作業領域外、対象外物体の移動しすぎで失敗したとき
  # gamma: 対象外物体の移動距離 1 m あたり。v19（2026-10-18）で 10 → 3。物体が多い盤面で押しのけて通れず、うろうろして
  # 止まった。13 個を平均 5 cm ずつ動かして −2（成功報酬 10 の 2 割）。未検証
  non_target_per_m: 3.0
  # 対象外の物体がゴールに近づくことへの減点（potential-based）。P = Σ max(0, 帯の幅 − 中心からゴールまでの距離) とし、
  # −係数 × (P_t − P_{t−1}) を与える。もともとゴールにある物体は除く。2026-10-16、Stage 6・7 の失敗の 1〜2 割が
  # 「対象外をゴールに入れる」で、−5 の失敗の手前に手がかりがなかったため追加。基本設定は 0（無効）で、
  # 効果は比べていない（未検証）
  non_target_near_goal_per_m: 0.0
  non_target_near_goal_band_m: 0.1
  # 対象外物体 1 個がこれを超えて動いたら失敗。2026-10-16 に 3 cm → 10 cm（くっついた物体の
  # 引き離し）→ 20 cm（混んだ盤面ではもう少し散らしてよい。v7 の Stage 6・7 の失敗の大半がこれだった）。
  # 移動 1 m あたり −10 の減点は残すので、20 cm 動かすと −2
  non_target_tolerance_m: 0.2
  # 対象外を non_target_tolerance_m を超えて動かしたら失敗にするか。v19（2026-10-18）で false: 方針は
  # 「最後に全部片付けばよい」。ゴールに入れたまま（foreign_in_goal）、置き場から出したまま（home_out）は成功にしない
  non_target_failure: false
  # 1 Action の間に車体の形（アームは除く）に触れた対象 1 個あたりの減点（v19、形をつける項ではない）。2D の車体は
  # 実機の形と違うので、車体で押す動きを減らし、開いたアームの間で押させる。車体で押し続ける 20 歩（−2.0）が、
  # アームで押し直す回り込み 10 歩の時間の罰（−0.5）より重くなる値（未検証）
  chassis_contact_penalty: 0.1
  redundant_gripper_penalty: 0.1  # zeta: 状態が変わらないグリッパー Action
  # 状態の変わる開閉 1 回あたりの減点（v28、2026-10-19 夕方）。v26 は 1 個運ぶのに約 4 回開閉し、実機のサーボの消耗・
  # 電池と時間に響く。既定 0（今まで）。比べる値は config/experiments/efficient.yaml（未検証）
  gripper_toggle_penalty: 0.0
  # epsilon: 毎ステップ。SB3 は時間切れの打ち切りを価値関数で補う（bootstrap）ので、止まり続けた価値は
  # -epsilon / (1 - gamma) = -100 epsilon になる。2026-10-16、0.01（-1）では失敗 -5 より軽く、Stage 6 で
  # 「動かずに時間切れを待つ」Policy になった。止まり続けが失敗と同じ -5 になる 0.05 にした。
  # 60 歩で成功すれば -3 で、成功報酬 10 を下回らない。
  time_penalty: 0.05
  # 形をつける項 kΦ(s′) − Φ(s) の k（v17）。v16 までは PPO の γ（0.99、Ng et al. 1999 の形）だったが、
  # 何も変わらない 1 歩にも (1 − γ)|Φ| の正の報酬が付き、対象が多くゴールから遠い Stage 7 では時間の罰 0.05 を上回った
  # （|Φ| ≈ 15 で +0.1 / 歩）。2026-10-18、v16 Seed 2 は Stage 7 で全敗しながら報酬の平均 +28（Seed 1 の成功は +13.8）で、
  # 遠くで止まる行動に固まっていた。1 にすると止まった 1 歩は時間の罰だけになり、上の time_penalty の根拠
  # （止まり続けの価値 −5）が成り立つ。割引した目的では方策の不変性は厳密でなくなる（早く進むほど得になる向き）。比較は v17
  shaping_discount: 1.0
  # 置き場（今のゴールか EpisodeSpec.zones、v18）を持つ対象外のうち、4 隅が置き場の外に出たもの 1 個あたりの減点
  # （ポテンシャル。戻せば戻る）。連続の色分けで前の色を押し出さないため。foreign_in_goal_penalty と同じ大きさ（未検証）
  home_out_penalty: 3.0
  # v34: 終わったとき（成功・失敗）にゴールの中の対象外・置き場から出た対象外 1 個あたりの減点（ポテンシャルではない）。
  # 上の 2 つはポテンシャルなので終端で戻る。全対象が入れば成功（success.require_cleanup: false）では押し込んでも損が
  # なくなるので、その分を残す。既定 0（今までと同じ）。値は test/configs/no_push_in.yaml
  leftover_penalty: 0.0
  # v26: 全対象が入った後の近づく項を直すべき対象外の接近点へ、運ぶ項（progress_per_m）に対象外の「直すべき距離」
  # （置き場の物体は角のはみ出し、置き場の無い物体はゴールの中への深さ）を足す。既定は無効（cleanup_guidance.yaml、未検証）
  cleanup_shaping: false
