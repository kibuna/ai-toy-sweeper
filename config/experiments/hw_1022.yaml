# v31（2026-10-22）: 実機の車体の計測・カメラの校正・動きの計測（MacBook）。robot_8hz.yaml（Action 0.125 s、遅れ、左右の利得）の後に重ねる。測っていない値は今のまま
sim:
  robot:
    # 車体の計測: 長さ（爪を除く）105 mm・幅 85 mm の丸い基板（Cutebot V3.6）。2D は箱なので、外接する箱にした（角は実物より
    # 出っ張る。丸い形との比較はない）。高さは測っていないので今のまま
    body_size_m: [0.105, 0.085, 0.0381]
    mass_kg: 0.144                   # 車体の計測（電池・爪込み）
    wheel_radius_m: 0.0175           # 車体の計測: タイヤ直径 35 mm
    wheel_separation_m: 0.075        # 車体の計測: タイヤの間隔（中心）
    axle_offset_x_m: -0.0275         # 車体の計測: 車軸は後端から 25 mm → 車体の中心から −27.5 mm
    caster_radius_m: 0.005           # 車体の計測: 直径 10 mm の球
    chassis_bottom_z_m: 0.010        # 車体の計測（Gazebo だけ。LEGO はポッチ込み 11.3 mm で潜らない）
    # 動きの計測: 動き出す境目（まっすぐ 18、その場の旋回 18〜20）より 1 段上の指令 20 の実測。まっすぐ前進 0.15・
    # 後退 0.14 m/s の平均、その場の旋回 2.6〜2.9 rad/s の真ん中（先に見積もった 2.7 rad/s とほぼ同じ）。1 Action 0.125 s で 1.8 cm・0.34 rad（20°）。今までの
    # 2 cm・14° より旋回が粗い（指令 22 なら 2.3 cm・25°）。片輪の旋回は指令 20 で動かないことがあるので使わない
    linear_speed_mps: 0.145
    angular_speed_radps: 2.75
  gripper:
    # 実測（閉じた状態、車軸から前へ）: 爪の軸 75 mm、爪の先 105 mm、挟んだ物の中心 90〜100 mm。
    # 車体の前面（車軸から 80 mm）より 5 mm 後ろに軸がある（丸い基板の上に重ねて付いている）。長さは軸から先まで 30 mm
    # （公式図面の 35 mm から。実物はくの字の梁）。これで爪の間の中心は 96 mm（実測 90〜100 mm）
    pivot_x_from_front_m: -0.005
    jaw_length_m: 0.030
    # 組み立て後の確かめ: pxt-cutebot の角度 20 で爪の先の幅 63 mm（今の 72 mm は M5Stack の公称）。上の長さのまっすぐな梁で、先の
    # 外側の幅が 63 mm になる角度（実物はくの字の梁で、形は合わせていない）
    jaw_open_angle_rad: 0.663
  objects:
    lego:
      size_m: [0.032, 0.016, 0.0096]   # 車体の計測: 32 × 16 mm（高さは規格のまま。ポッチ込みは 11.3 mm）
    toy_car:
      size_m: [0.080, 0.033, 0.027]    # 車体の計測: 使うミニカー 80 × 33 × 27 mm
      mass_kg: 0.067                   # 車体の計測: 67 g
  real_world_effects:
    # 電池で速さが変わる。±15% は MacBook の案で、電池の消耗での変化は未測定（未検証）。
    # 押したときの遅れ（ミニカーで 28%、LEGO で 5%）も一部この範囲に入る（押す力の上限のモデルは無い）
    speed_gain: [0.85, 1.15]
    # 左右の車輪の利得（左右別々に引く。robot_8hz の ±5% を置き換える）。補正なしの実測で、指令 20 の前進は −0.15〜−0.24 rad/s
    # 曲がる（左右の速さの差 約 8%）。実機の側で左右を補正するまでは ±8%（MacBook の案 ±8〜10% の下側）。未検証
    wheel_gain: [0.92, 1.08]
task:
  sampling:
    # ロボットの中心（車軸）を置く範囲の、作業領域の端からの距離。今の 0.1 m は、車軸から最も遠い点 0.098 m
    # （robot_model.robot_radius）より少し大きい値だった。車体が長くなり 0.101 m になったので、はみ出さない 0.11 m
    robot_margin_m: 0.11
  observation:
    occlusion:
      # カメラの校正: カメラは高さ 0.66 m、作業領域の中心から 0.87 m 手前（今までは Gazebo の斜め上のカメラの位置）
      camera_xyz_m: [0.0, -0.87, 0.66]
      # 動きの計測: 車軸の真上・高さ 65 mm のマーカーの台紙が、爪の間の物を隠す。車体の箱を 65 mm の高さまでの
      # 陰とみなす（台紙は 50 mm 角で、車体全体より小さい。粗い近似、未検証）
      robot_height_m: 0.065
