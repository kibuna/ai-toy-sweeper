# v30（2026-10-22）: 実機の動きの計測に合わせる。
# 床の上では 0.08 m/s は出せない（動く最小の指令 18 で 0.12 m/s、15 は動かない）。速さが境目ぎりぎりだと静止摩擦の
# ため再現性が落ちるので、少し速めにする。Action の間隔を半分にして速さを 2 倍にし、1 歩で進む距離・回る角度を今までの
# 学習と同じ（2 cm、0.25 rad ≈ 14°）にする。報酬・割引率・歩数の上限は 1 歩あたりの値なので変えない（1 歩の意味が同じ）
sim:
  robot:
    # 指令 20 の実測 0.155〜0.164 m/s（前進、2026-10-22 16:05〜16:12）。動き出す境目 18（0.12 m/s）より少し上。
    # 最終の値は実機の動きの計測で決める（未確定。hw_1022.yaml で上書きする）
    linear_speed_mps: 0.16
    # その場の旋回は指令 18 で 0.73〜2.1 rad/s（回らない回もある）、指令 20 で 2.93 rad/s。1 歩 0.25 rad になる 2.0 にした
    # （今までの 1 歩 14° と同じ。押す向きを合わせる細かさ）。実機でこの速さを出す指令は未確定
    angular_speed_radps: 2.0
  real_world_effects:
    # 指令が効くまでの遅れ（その間は前の指令が続く）。止まるまでの距離 9〜21 mm は 0.16 m/s で 0.06〜0.13 s の続きに当たり、
    # 動き出すまで 0.13〜0.33 s（撮影時刻の見積もり 0.1 s を含む）から見積もりを引くと 0.03〜0.23 s。今のモデルは 1 Action
    # 未満しか表せないので、その範囲の 0〜0.1 s（0.025 s 刻み）。未検証
    command_latency_s: [0.0, 0.1]
    # 左右の車輪の利得（左右別々に引く）。速さのばらつき（前進 0.124 / 後退 0.113 m/s のような差、±5〜10%）と左右の差。
    # ±5% で左右の差は最大 0.1 × 0.16 / 0.075 ≒ 0.2 rad/s（補正しないときの実測の右への曲がり 0.2 rad/s と同じ程度）。未検証
    wheel_gain: [0.95, 1.05]
task:
  control:
    # 8 Hz。カメラ 10 fps（実測 9.7〜10.0）なら毎 Action に新しいフレームがある（0.1 s では撮影の周期と同じで、同じフレームを
    # 2 回使う回が出る）。BLE の書き込み 1 回は中央値 49 ms、95% 63 ms（BLE の確かめ）。検出・方策を含む 1 周の時間は未測定
    action_duration_s: 0.125
