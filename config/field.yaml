# 現場側（MacBook）の非同期ランタイム（toy_sweeper.field）。
# 制御の周期は方策の学習の設定（checkpoints/<run>/config_snapshot/task.yaml の control.action_duration_s）をそのまま使い、
# ここには持たない。実機で使う方策では 0.125 s（1 秒 8 回）。
# 2026-10-17 に実機の到着前の値で作り、2026-10-22〜10-30 の実機の計測で多くを決め直した。各値の根拠と、比べていない値
# （未検証）は、それぞれのコメントに書いてある。

control:
  # 指令の有効期限（「最後の有効コマンドから 500 ms で停止」の初期値）。
  # (1) 送る直前に、作ってからこれを過ぎた指令は送らない（例外で止める）。(2) ロボット側は、最後に受けた指令から
  # これを過ぎたら止まる（実機は micro:bit のファームウェアの定数をこの値に合わせる。SimWorld はこの値で止まる）。
  # 下限: 1 周期 0.25 s + 指令の遅れ + 周期の遅れの上限（max_tick_lateness_s）より長くないと、毎周期の指令の間で
  # 止まってしまう（学習では 1 Action が 0.25 s 続く）。field/config.py が検査する。
  # 上限の目安: 制御が止まってから、これだけ前の指令で走り続ける（0.08 m/s で 4 cm）。
  # BLE の遅延を実測して決め直す（未検証。他の値との比較なし）
  command_ttl_s: 0.5
  # 予定の時刻からの遅れがこれを超えた周期があれば止める。1 周期 0.25 s の 40%。これより遅れると、1 Action の長さが
  # 学習（いつも 0.25 s）と大きく違ってくる。どこまで許せるかの比較はしていない（未検証）
  max_tick_lateness_s: 0.1
  # PPO の推論のスレッド数（torch.set_num_threads）。Policy は約 1.8 万パラメータの MLP で、1 スレッドで 1 ms 未満。
  # torch の既定（コア数）では、検出・描画のスレッドと CPU を取り合う。2 以上との比較は未実施（未検証）
  torch_threads: 1
  # 止めずに続ける（時間切れなし、仕切り直しの回数なし、古いフレーム・追跡と通信の切れは止まって待つ・つなぎ直す）。止めるのは
  # 停止の要求と、つなぎ直せないときだけ。シミュレーション・Gazebo のリハーサルは false（今まで: 失敗を数えるため）。
  # 実機は real.persist で置き換える
  persist: false
  # PPO の行動を確率的に選ぶ（方策の出す確率で引く）か、いつも一番確からしい行動にする（決定的）か（scripts/field_app.py、
  # 実機と 2D の実時間シミュレーションの両方）。2026-10-25、同じ動きを繰り返して行き詰まらないよう、
  # 確率的に選べるようにした（実機で試すため設定で切り替える）。今までの既定は決定的（field_app.py の --stochastic を
  # 付けたときだけ確率的）だったが、評価（2D の 300 回、Gazebo のリハーサル）はすべて確率的で測っている。決定的は同じ動きを
  # 繰り返して時間切れになりやすい（v13 の s0 の Stage 7: 決定的 0.05、確率的 0.30、2026-10-16）。
  # v32 を決定的に選んだときの成功率は測っていない（未検証）
  # 2026-10-30: 決定的で実機を試す。今日の録画 10 本で、旋回の半分以上が逆向きへの切り返し
  # （+85° → −105° → +116° …）で、確率的に引いた低い確率の向きが切り返しを増やしている疑い。10/27 の「greedy はだめ」は電池が
  # 減って車輪が回っていなかったときで、比べられていない。決定的で切り返しが減るか・時間切れにならないかを実機で確かめる（未検証）
  policy_stochastic: false
  # 爪の開け閉めを送った後、走らずに待つ時間（方策は呼ばない）。2026-10-30、Fable のレビュー: 実機の録画（003・002）で爪が
  # 閉じ切るまで 0.4〜0.6 s かかるのに、次の周期（0.125 s 後）から旋回して閉じかけの爪で物を弾いた（002・004 の挟み損ねの
  # くり返し）。学習では開閉の 1 行動の間は走らない（Controller.commands）ので、閉じ切るまで待つのは学習の意味に合う。
  # 0.5 s は 2 本の録画の上の方（未検証。telemetry.jsonl と録画で測り直す）
  gripper_settle_s: 0.5

safety:
  # 安全監視の周期。カメラの 1 フレーム（10 fps で 0.1 s）の半分で、停止までの遅れはこれ + 指令の遅れ。
  # 監視自体は軽い（属性の比較だけ）。未検証
  check_period_s: 0.05
  # カメラの最新フレーム・追跡の結果（撮影時刻）がこれより古ければ止める。
  # 2026-10-22、0.5 s（10 fps の 5 フレーム）から 1.0 s へ（遅れを厳しく取る必要は小さい）。実機は 0.145 m/s で、
  # 1 s 来なければカメラか検出が止まったとみなす（0.5 s では検出の一時的な遅れでも片付け全体が止まった）。比べたことはない（未検証）
  max_frame_age_s: 1.0
  # 制御が使う追跡の結果の古さ（元のフレームの撮影時刻から）の上限。超えたらその周期は指令を出さずに止める。
  # 通常はフレームの間隔 0.1 + 撮影の遅れ 0.08 + 検出 約 0.02 = 約 0.2 s。
  # その 2 倍。学習では観測の古さは常に 0（ToySweeperEnv）なので、0.2 s の古さ自体が学習との差になる（未検証）
  # 2026-10-22、実機（8 Hz、v31）で平均 210 ms・p95 354 ms・最大 467 ms だったので 0.4 → 0.5 s（遅れを厳しく取る必要は
  # 小さいので）。超えた周期は止まって待つだけ（下の stale_obs_hold_s）
  max_obs_age_s: 0.5
  # 観測が上の上限より古い周期は、ロボットを止めて待つ（Policy を呼ばない）。古い状態がこれだけ続いたら止める。2026-10-22 の実機
  # （8 Hz、v31）で観測の古さは平均 210 ms・p95 354 ms・最大 467 ms で、1 回の 467 ms で片付け全体が止まった。1 s は 8 周期、
  # カメラの 10 フレーム。それより長く続くのは検出か撮影の異常とみなす（比べたことはない、未検証）
  stale_obs_hold_s: 1.0
  # 開始から最初のフレーム・最初の追跡の結果が来るまで、および指示の後に新しい追跡の結果が来るまでの上限。
  # 指示そのものを待つ時間は含めない（人が言うまで来ない）。シミュレーションでは 0.2 s ほどで来る。
  # 実カメラの起動（USB カメラは数秒かかることがある）は未測定（未検証）
  startup_timeout_s: 5.0

perception:
  # 追跡を消すまでの時間。config/perception.yaml の max_missed（8 フレーム）は 0.25 s 周期のフレームで「2 秒」の意味で
  # 決めた値なので、同じ 2 秒をカメラの fps でフレーム数に直して使う（10 fps なら 20 フレーム）。
  # gate_m（1 フレームの移動の上限 5 cm）はそのまま使う。10 fps では 1 フレームの移動は 1 cm 未満なので、0.25 s 周期より緩い（未検証）
  track_hold_s: 2.0
  # 同定（実機は VLM）に出す追跡の、見え続けた時間の下限（カメラの fps でフレーム数に直す）。2026-10-27 の実機（青の LEGO、
  # 84 s）で、同定し直しが爪の先・後輪の短命な塊（茶色、色相 45〜77°）を「青の LEGO」として対象にし、VLM の 1〜2 s の間に消えて
  # 仕切り直しを 5 回くり返した（Fable のレビュー）。置いてある物は何秒も見え続けるので、1 s で落ちるのは塊だけの見込み。
  # 0.5・2 s との比較なし（未検証）
  identify_min_seen_s: 1.0
  # 仕切り直しで決まった歩数（perception_oblique の recover_back_steps 4）下がっても、見えない対象の最後の位置がロボットの陰
  # （検出から除く範囲）なら、さらに 1 歩ずつ下がる上限。2026-10-22、実機（1 歩 0.125 s × 0.145 m/s = 1.8 cm）で奥のゴールの LEGO が
  # 車体と台紙（高さ 65 mm）の陰になり、4 歩（7 cm）では出られなかった。8 歩足して計 12 歩（22 cm、車体の長さ 105 mm の 2 倍）
  # （未検証）
  recover_extra_back_steps: 8
  # ロボットの姿勢が一瞬取れない（マーカーが読めない）とき、最後に取れた姿勢から送った走行の指令で見積もって続ける時間の上限。
  # 2026-10-22、実機で奥・暗い所・手でマーカーが一瞬読めず、古い観測で止まって待つことが 43 周期あった（動作が
  # いちいち止まる）。0.5 s は 4 周期で、前進 7 cm・旋回 79° まで（見積もりの誤差は車輪の滑り・左右の差の分。未検証）。
  # これを過ぎたら今までどおりフレームを飛ばし、古い観測で止まって待つ
  pose_predict_max_s: 0.5
  # 開始時に、物体の同定（シミュレーションは真の物体の一覧、実機は VLM の予定）と追跡を結び付ける距離の上限。
  # perception_env.PerceptionObsWrapper と同じ 2 cm（合成画像での検出の位置誤差は 1 mm 程度）。実カメラでは未検証
  association_tolerance_m: 0.02
  # 対象の追跡の画素の平均色が、同定したときから変わったら、追跡が別の物体（隣の物体やロボットのはみ出した部分）に
  # 入れ替わったとみなして止める。付け直し・挟み損ねの判定（field.rehearsal）の
  # 「同じ色」も同じ上限。2026-10-19 に、RGB の距離（上限 100、2D の合成画像で決めた値）から、明るさを除いた色度の距離
  # （×255、perception.chroma_distance）に変えた。Gazebo のリハーサル（v26、今の条件と照明 8 条件、正しい追跡 4,337 フレーム）:
  # 爪から 10 cm より遠い物体の色度の変化は最大 0.5（RGB は 27）、爪を開いていて近い物体は p99 4.4・最大 15。違う色の物体
  # どうしの最小は 12（ピンクと黒）、同じ色の LEGO とミニカーは 5 以下。RGB では違う色（黄・オレンジ・ライム）が 23〜38 しか
  # 離れず区別できなかった。上限 8 は 4.4 と 12 の間（未検証。実カメラの照明・ホワイトバランスで測り直す）
  identity_chroma_tolerance: 8.0
  # 上限を超えたのが何回続いたら止めるか。爪の近くの 1 フレームだけの外れ（最大 15）で止めないため。3 フレームは 0.75 s
  # （未検証）
  identity_persist_frames: 3
  # 爪を閉じていて、対象が爪の中心から 10 cm 以内なら色を見ない。閉じた爪の画素が物体の塊に混ざり、正しい追跡でも色度が
  # 最大 70（0〜10 cm）変わった（10 cm より遠いと 0.3 以下）。開いた後に見る（未検証）
  identity_skip_closed_radius_m: 0.1
  # 爪を開いていても、対象が爪の中心から 3 cm 以内（爪の間）なら色を見ない。2026-10-19、フローリングの床（floor_oak）の
  # リハーサル 36 盤面の正しい追跡で、爪を開いて 0〜3 cm の物体の色度の変化は最大 35（8 を超えたのは 1〜2%。爪と床の画素が
  # 混ざる）、3 cm より遠いと最大 3.4。盤面 20044 で、運び終えて爪を開いた直後に取り違えとして止まった（未検証）
  identity_skip_open_radius_m: 0.03
  # 爪を開いて全対象がゴールに入ったように見えても、対象が上の 3 cm 以内（色を見ない範囲）なら、下がって色を確かめてから
  # 完了にする（field.runtime.Controller、2026-10-19、盤面 20029: 空の爪で運び、開いた爪の中の暗い検出に対象の追跡が付いて、
  # 色を見ないまま完了にした）。1 歩の後退は 2 cm（0.08 m/s × 0.25 s）で、置いた物体（爪の中心から 0〜1.5 cm）は 1〜2 歩で
  # 3 cm の外に出る。余裕を見て 3 歩。それでも爪の中にあれば、ロボットに付いてくる偽の追跡とみなして Policy に戻す。
  # 爪を開いた後に見えていない対象（爪の中で隠れている）があるときも同じく下がる（盤面 20006・20011、未検証）
  # 2026-10-28: 3 → 6。実機（1 歩 1.8 cm）では、置いた物が高さ 7 cm の車体の陰になる。カメラ（高さ 0.75 m、中心から 0.85 m 手前）
  # からの陰の長さは 0.07 × 0.85 / (0.75 − 0.07) ≈ 8.7 cm で 5 歩、余裕で 6 歩。3 歩では成功 2 本とも見えないまま仕切り直し
  # （VLM）に入り 3.4〜4.5 s 失った（Fable のレビュー）。向き・場所で陰は変わる（未検証）
  completion_confirm_back_steps: 6
  # Policy に渡すゴールと完了の判定に使うゴールを、縁から内側へ縮める量（field.runtime.make_assignment）。
  # 2026-10-18、Gazebo のリハーサル（斜め上のカメラ、背景との差の検出）で、観測 − 真値の y が盤面ごとの平均で
  # −2.5〜−5.9 mm（カメラ側にずれる。上の面と手前の側面が写るため）、ばらつき 1〜2 mm だった。奥の縁では真値で 4 mm
  # ほど外の物体が中に見え、「完了と判断したのに真値では外」が v19 s1 で 10 盤面中 2、v21 s1 で 4 起きた。
  # 偏り 6 mm + ばらつき 2 mm で 8 mm。実カメラの偏りは未測定（実機で校正のときに測る、未検証）
  goal_margin_m: 0.008

sim:
  # 実時間シミュレーション（toy_sweeper.field.sim: SimWorld / SimCamera）。実機の代わりなので、ここの値は実機の推定（未検証）。
  # カメラの fps。「5〜10 fps から開始」の上側。5 fps との比較は未実施
  camera_fps: 10.0
  # 撮影から画像を受け取るまでの遅れ。一般的な USB カメラの 50〜150 ms の中ほど（未測定）
  capture_latency_s: 0.08
  # 指令を送ってから車輪に効くまで。BLE の接続間隔（7.5〜50 ms）の上側（未測定）
  command_latency_s: 0.05
  # ArUco で測るロボットの姿勢の誤差（正規分布の標準偏差）。ArUco はシミュレーションしないので、真値にこれを足す。
  # 一般的な俯瞰カメラの ArUco の誤差の目安（数 mm、1°程度）。未測定
  robot_pose_noise_m: 0.002
  robot_yaw_noise_rad: 0.02
  # 物理が実時間からこれ以上遅れたら例外にする（黙って遅い世界で測らない）。1 Action の 40%（max_tick_lateness_s と同じ）
  max_realtime_lag_s: 0.1

camera:
  # 実カメラ（toy_sweeper.field.hardware.OpenCVCamera）。Logitech HD Pro Webcam C920（USB、2026-10-22）。
  # カメラの名前（macOS のカメラの一覧の名前）。cv2.VideoCapture の番号は、開くたびにこの名前から引く（hardware.camera_index）。
  # 番号は iPhone の連係カメラの有無や抜き差しで変わる（2026-10-22 は 0 = iPhone・1 = C920 と 0 = C920 の両方、2026-10-27 は
  # 0 = iPhone・1 = C920）。番号を覚えて使うと、変わるたびに起動で止まった（2026-10-27）
  device_name: HD Pro Webcam C920
  # 解像度。フル HD。校正と ArUco に要る（doc/camera_setup.md: Gazebo で 1280×720 では奥のマーカー 6 cm が潰れた）。
  # 前の 640×480 では校正と違う画像になる
  width_px: 1920
  height_px: 1080
  # 要求する fps。sim.camera_fps と同じ 10。C920 は 1920×1080 で 10 を受け付け、3 秒で 9.7〜10.0 枚/秒を実測（2026-10-22）。
  # 指定しないと 5 fps を返した。カメラが受け付けたかを読み返して確かめる（違えば例外）
  fps: 10.0
  # 撮影から read() が返るまでの遅れの見積もり。撮影時刻 = read() が返った時刻 − これ。未測定（LED と時計を撮って測る）
  capture_latency_s: 0.1

ble:
  # micro:bit（Cutebot）との BLE UART（toy_sweeper.field.hardware.BleRobotLink）。すべて未検証。
  # micro:bit の広告名は「BBC micro:bit [5 文字の名前]」。先頭が一致する機器に接続する
  device_name_prefix: "BBC micro:bit"
  # micro:bit の UART サービス（Lancaster 大学の micro:bit Bluetooth プロファイル）。Nordic UART と同じ UUID だが、
  # micro:bit では 6E400003 が「PC が書き込む（RX）」、6E400002 が「micro:bit が送る（TX、indicate）」（Nordic と逆）
  uart_service_uuid: "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
  uart_rx_char_uuid: "6e400003-b5a3-f393-e0a9-e50e24dcca9e"
  uart_tx_char_uuid: "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
  # 機器を探す時間と、接続の時間の上限。bleak の既定（10 s / 30 s）を明示。micro:bit で測っていない
  scan_timeout_s: 10.0
  connect_timeout_s: 30.0
  # 応答ありで書き込む（届かなければ例外になる）。応答なしより遅い（接続間隔 1〜2 回分）が、黙って失われない。比較は未実施
  write_with_response: true
  # 1 回の書き込みの上限。BLE の既定の ATT MTU 23 から 3 を引いた 20 バイト。超える指令は送らない（例外）
  max_payload_bytes: 20
  # 走行の Action ごとのモーター指令（Cutebot の -100〜100、[左, 右]）。2026-10-22 の動きの計測の実測（床の上、単 4 アルカリ）で
  # 決めた。速さに比例しない（まっすぐは 15 で動かず 18 で 0.12 m/s、旋回は 18 で回ったり回らなかったり）ので、表で持つ。
  # 境目ぎりぎりの速さでは静止摩擦のため再現性が落ちるので、境目より 1 段上の 20:
  # 前進 0.149〜0.154 m/s・後退 0.142〜0.145 m/s（学習 v30 の 0.16 m/s、config/experiments/robot_8hz.yaml）、
  # その場の旋回 左 2.61〜2.68・右 2.73〜2.88 rad/s（学習 v30 は 2.0 rad/s で、合っていない）。
  # 左右の差の補正（2026-10-22 21:00。左右に同じ指令を出すと右に曲がった）: 左右 20 のとき前進で
  # −0.15〜−0.17 rad/s、後退で +0.11〜+0.12 rad/s 曲がった（右の車輪が遅い）。指令 20 の近くでは指令 1 で速さが約 0.015 m/s 変わる
  # （18: 0.12、20: 0.15、22: 0.18 m/s）ので、右を 21 にすると曲がりは +0.015 / 0.075 ≒ +0.2 rad/s 寄る見込み（前進は ほぼ 0、
  # 後退は −0.08 程度に左へ寄りすぎる見込み）。補正した後は測っていない（未検証。measure_motion.py straight で確かめる）。
  # 電池の消耗で速さが変わる（速さの帰還は実機での片付けで作る予定）。
  # 走行の指令（v, ω）が学習の Action の速さ（sim.robot.linear_speed_mps / angular_speed_radps）と一致しなければ例外
  action_motor:
    FORWARD: [20, 21]
    BACKWARD: [-20, -21]
    TURN_LEFT: [-20, 20]
    TURN_RIGHT: [20, -20]

real:
  # 実機の知覚（背景との差の検出、perception_oblique）で、Gazebo で決めた config/perception_oblique.yaml と違う値。
  # ロボットを除く範囲の高さ。micro:bit の上端とロボットのマーカー（台紙）が床から 約 65 mm（2026-10-22 の実測）。
  # perception_oblique.yaml の 45 mm（車体 38 mm、micro:bit は未計上）では、それらを物体と見誤る。65 mm + 余裕 5 mm（未検証）
  robot_mask_height_m: 0.07
  # ロボットを除く範囲の車体の形（車軸の中点から: 後ろの端、前の端、左右の半分）。実測（2026-10-22）: 長さ 105 mm で車軸は
  # 後ろから 25 mm、幅 85 mm、丸い基板（外接する長方形で除く）。config/sim.yaml の車体（85.7 × 85.3 mm の箱、車軸から後ろ
  # 22.8・前 62.9 mm）は実機と違い、前の 63〜80 mm（グリッパーの取り付け部）が除かれない。シミュレータを実機に合わせる作業で sim.yaml が実測に
  # 直ったら、これは要らない（爪の形は sim.yaml のものを使う）
  # 2026-10-28: 後ろ −25 → −45 mm、幅 ±42.5 → ±55 mm。実機の録画（10/27 の成功 2 本、302 フレーム）で、ロボットに付いて動く
  # 前景を高さ 10〜20 mm の面に戻して集めると、7 割以上のフレームに出る範囲は後ろ −45 mm、車軸のあたりの幅 ±50〜55 mm（後輪・
  # キャスター・車輪の出っ張り）。いまの範囲の外に残った塊を、同定し直しが「青の LEGO」として追った（Fable のレビュー）。
  # 爪は薄く上が空いた形で、先端 100〜110 mm は sim.yaml の形と合うので変えない。録画は重ね描きの
  # 印が混ざり、細かくは決められない（未検証）。重ね描きなしの動画（_raw.mp4）で決め直す
  body_x_m: [-0.045, 0.08]
  # 2026-10-30: 幅を ±55 → ±42.5 mm（10/22 の実測の幅 85 mm）に戻し、余白を robot_margin_m で 10 → 5 mm にした。Fable のレビュー:
  # 下がった後の赤いブロックが左後輪の脇（ロボット座標 (−20, +40) mm）で、±55 + 10 mm のマスクに完全に入って見えなかった。
  # 12:54 の背景で撮った録画 268 コマで、55/10・48/8・42.5/8・42.5/5 mm を比べると、どれも車体の後ろ・横に同じ所に出続ける
  # 塊（4% 超えのコマ）は無く、車体の脇に見える物は 0.16 → 0.22 個/コマに増えた。10/28 に広げた理由（後輪・キャスターの塊）は、
  # 高さ 70 mm の投影と影を幅で吸っていたと見る（後ろは 7 cm・取り付け部は 4 cm に分けた）。余白 5 mm は ArUco の誤差 数 mm
  body_half_width_m: 0.0425
  # 実機の車体を除く範囲の余白（perception_oblique.yaml の robot_margin_m 10 mm を実機だけ置き換える。根拠は上）
  robot_margin_m: 0.005
  # 姿勢の先読み（runtime.to_now・マーカーが読めない間の見積もり）に使う、送った走行の指令に対する実機の動き方。指令は
  # motion_delay_s 遅れて倍率 motion_gain_* で効き始め、速さは時定数 motion_lag_s で追いつく（止めた後も惰性で動く）。
  # 2026-10-30、決定的で走った記録 2 つ（読めた姿勢 917 件、区間 11）から
  # scripts/fit_motion_from_telemetry.py で割り出した: 旋回 遅れ 70 ms・時定数 100 ms・倍率 1.00（読めた姿勢どうしの向きの変化の
  # 誤差 6.5° → 2.3°）、前進 遅れ 80 ms・時定数 100 ms・倍率 1.10（5.8 → 2.1 mm）。最初の 251 件では 120 ms・80 ms・1.10/1.05 で、
  # 遅れと時定数は片方を増やすと片方が減る（合わせた遅れは 0.17〜0.2 s）。遅れは撮った時刻の基準で、カメラの遅れ + 指令が効く
  # までの遅れ。前は遅れ 0・惰性なし・倍率 1（指令がその場から学習どおりに効く）で先読みし、旋回の行き過ぎと切り返しが多かった。
  # 遅れは旋回と前進の間の 75 ms、倍率は別々。記録 2 つ分で決めた（未検証。走りの記録が増えたら割り出し直す）
  motion_delay_s: 0.075
  motion_lag_s: 0.1
  motion_gain_linear: 1.10
  motion_gain_angular: 1.00
  # 実機の速さは電池で ±3 割変わる（2026-10-30: 減った電池で旋回 0.65・前進 0.80、新しい電池で 1.25・1.30）ので、倍率は走りながら
  # 割り出して先読みに使う（field.motion_gain。上の motion_gain_* は組が溜まるまでの値）。読めた姿勢どうしの組（約 0.1 s）の、倍率 1 の
  # 動きに対する比の中央値。窓 160 組は、走っている 16 s ほど（電池の減りは数十分で効く）。10/30 の記録 3 つで 80・160 組を比べ、
  # 160 の方が見積もりの 5〜95 % の幅が狭かった（旋回 昼 0.85〜1.08 → 0.91〜1.07）。min_pairs 20 は、1 組の比のばらつき（中央値の
  # 標準誤差）を見て決めたのではない（未検証）
  motion_gain_window_pairs: 160
  motion_gain_min_pairs: 20
  # 車体の前の mount_x_m〜body_x_m[1] は、グリッパーの取り付け部（サーボと爪の支点）で、高さ mount_height_m で除く（後ろは
  # robot_mask_height_m）。2026-10-30 の実測（グリッパーの支点のあたりが 4 cm、手の部分は 1 cm。手は
  # sim.yaml の爪の上端 9.3 mm のまま）。前は車体全体を 70 mm で除き、ロボットが奥を向くと爪の中心から先 3 cm まで隠れて、
  # 爪の近くの対象を見失った。境の 63 mm は 2026-10-22 の実測のメモ「前の 63〜80 mm がグリッパーの取り付け部」
  # （sim.yaml の車体の前の端）。micro:bit・マーカーがその前に出ていないかは、重ね描きなしの動画で未検証
  mount_x_m: 0.063
  mount_height_m: 0.04
  # 背景との差の塊を、近い画素でつなぐ円のカーネル（perception_oblique の close_px）。2026-10-22 の実機の画像（保存 2 枚、
  # data/camera/detection_20261022_181534/）で 0・5・9・13・17・21 px を比べた: 0 ではミニカーが窓・タイヤの暗い帯で 2〜4 個に
  # 割れ、9 px で 2 台とも 1 個になった（5 px では片方が 2 個のまま、13〜21 px は 9 と同じ）。代わりに、すき間 数 mm で置いた
  # LEGO 2 個は 5 px から 1 個になる（くっついた物はもともと 1 個に見える）。割れたかけらは VLM の同定と追跡を乱すので 9 にした
  close_px: 9
  # くっついた違う色の物体（LEGO 2 個）を色と場所で分ける（perception_oblique.split_by_color、閾値は perception_oblique.yaml）。
  # 2026-10-18 の Gazebo で「押した LEGO が隣とくっついて 1 つの塊に見える」と分かり「実機の前に直す」としていた。
  # 実機でも違う色の LEGO 2 個が 1 個に見えた。実機の画像 3 枚・21 個の塊で: くっついた LEGO 2 個（3 例）は色の中心の差
  # 37〜42・少ない側 39〜41%・重心の離れ 0.52〜0.66、ミニカー（黄の車体 + 暗い窓）は 41〜43・38〜50%・0.13〜0.31、1 個の LEGO は
  # 差 17〜24。差 30・少ない側 30%・離れ 0.4 で、くっついた 3 例だけが分かれる（例が少なく、未検証）。同じ色どうしは分けられない
  color_split: true
  # 見失った対象を、同じ色の物とくっついた大きな塊に付け直す塊の長辺の上限（perception_oblique の merged_max_length_m）。
  # 2026-10-23 の Gazebo のリハーサル（盤面 20064）で、LEGO（32 mm）が同じ色のミニカーとくっついた塊が 133 mm に見え、大きさが違う
  # ので付け直せず見失った。どちらも運べばよいので、塊ごと押す。LEGO + ミニカー（実測 約 80 mm）+ 余裕で 0.15 m。
  # LEGO + LEGO の塊（約 70 mm）も入る。実機の画像では確かめていない（未検証）
  merged_max_length_m: 0.15
  # 追跡のフレーム間の対応付けで、前のフレームと色度がこれ以上違う検出にはつながない（perception_oblique の track_chroma_gate）。
  # 2026-10-25 の Gazebo のリハーサル（v32 の Stage 6 盤面 20008）で、挟んだ緑の LEGO の追跡が、隣でくっついた黒・水色の LEGO の
  # 塊へ移った（そのフレームの色度の差 22.7・16.9）。値は identity_chroma_tolerance と同じ根拠: 実機の画像で同じ物は影・爪の近くで
  # 11.3 まで変わり、違う物どうしで最も近い組が 16.4。その間の 14（0 との比べはリハーサルの実機の決まりだけ、実機では未検証）
  track_chroma_gate: 14.0
  # 対象の追跡の色が同定したときから変わったとみなす色度の差（perception.identity_chroma_tolerance を実機だけ置き換える。超えたら
  # 仕切り直す）。2026-10-22 の実機の画像で: 正しく追跡していた緑の LEGO がロボットの影・爪の近くで 11.3 変わった。違う物どうしの
  # 最も近い組はオレンジの LEGO と黄色のミニカーで 16.4（種類も大きさも違う）、次が黄緑の LEGO と黄色のミニカー 21.9、同じ色の
  # LEGO どうしは 3.6。その間の 14（Gazebo で決めた 8 では止まった。比べた記録は 1 回分だけ、未検証）
  identity_chroma_tolerance: 14.0
  # 実機は止めずに続ける（control.persist を置き換える）。2026-10-22、時間切れ・見失い・遅れ・一瞬のマーカーの見失いで何度も止まった。
  # 時間切れなどで止めず、続ける。止めるのは停止の要求（とまって・止めるボタン）と、
  # 通信をつなぎ直せないときだけ。古い観測では動かず止まって待つ
  persist: true
  # 物体の塊の作り方（2026-10-25）。background: 背景との差（今まで）。learned: 学習した
  # 検出器（YOLO のインスタンスセグメンテーション、config/seg_detector.yaml のモデル）。learned は
  # Gazebo の画像だけで学習したもので、実機の画像では確かめていない（未検証）。塊から床の位置を出すところ、探す範囲、ロボットの
  # 範囲は同じ。MacBook ではモデル（checkpoints/seg_v1/best.onnx）を 3090 から写してから使う
  detector: background
  # VLM が緑・黄緑と答えた物を、カメラで見た明るさ（追跡の平均色の Lab の L*）で決め直す境目（これ以上は黄緑）。2026-10-22、
  # 実機で VLM が黄緑の LEGO を green と答え（画像ごとに green・lime とゆれた）、「みどり」の指示で黄緑を運んだ。前は明るさ
  # （L* 42）で分けたが、2026-10-26 の実機で黄緑が L* 39〜41（奥・暗い所）になり緑にされ、「きみどり」が見つからなかった。
  # 色相（Lab の a*・b* の角度）で分ける: 夜の室内灯の実機の画像で、緑は 129°・134°、黄緑は 101°・105°。その間の 118°
  # （4 個の追跡の平均色だけから。未検証）。これ以下は lime
  green_lime_split_hue_deg: 118.0
  # 管理のアプリが、カメラの番号ごとの画像を背景（校正の空の床）と比べて選ぶときの、差（縮めた画像の画素の差の平均、0〜255）の
  # 上限。2026-10-22、C920 で LEGO・ミニカー・ロボットを置いた床が 6.1。別の所を写すカメラはずっと大きい見込み（測っていない）。
  # 6.1 の 4 倍（照明の変化の余裕）の 25（未検証）
  camera_match_max_diff: 25.0

# 指示ごとの動画（scripts/field_app.py、field.record.TaskRecorder）。2026-10-25。
# 指示を受けて動き始めてから、終わる・止まるまでのカメラの映像に、Web の映像と同じ重ね描き（追跡: 対象は赤・同定した
# 物は白・名前のない追跡は紫、ロボットの向き、ゴールの枠、状態）と、下に指示・経過・結果を書く。保存は
# data/camera/<起動の日時>/videos_real/（実機）・videos_sim/（2D の実時間シミュレーション）。部屋が写るので git に入れない
# （data/camera/ は .gitignore 済み）。mp4（MPEG-4 Part 2、OpenCV の mp4v。QuickTime で開ける見込み、未確認）
record:
  tasks: true
  # 終わった後も記録する秒数（終わりの盤面を見るため。eval_rehearsal.py の動画の結果の表示と同じ 2 秒。未検証）
  hold_after_s: 2.0
