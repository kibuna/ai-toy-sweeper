# 俯瞰カメラ画像からの検出と追跡（toy_sweeper.perception）。今の値はシミュレーションの合成画像
# （toy_sweeper.render.draw_scene）に合わせたもので、実カメラでは空の作業領域を撮って決め直す（未検証）。
floor_rgb: [196, 160, 118]   # 合成画像の床の色。実機では空の作業領域の画素の中央値
color_threshold: 40.0        # 床の木目の筋（床との差 約 20）は拾わず、黒い LEGO（差 約 230）は拾う値
min_area_px: 60              # LEGO 2×4 は 800 px/m で約 25×13 = 325 px。その 1/5 未満は雑音
# ロボットの部品（ArUco の姿勢から計算）の周りを余分に除く幅。2026-10-16、1 cm では押している LEGO の大半が一緒に消え、
# Stage 2 の Heuristic で 50 件中 7 件が対象を見失った。3 mm で 0 件（合成画像、ArUco の誤差なし）。
# 実機では ArUco の姿勢誤差の分だけ広げる必要があり、実カメラで決め直す
robot_mask_margin_m: 0.003
gate_m: 0.05                 # 1 フレーム（0.25 s）の移動の上限。ロボット 2 cm/フレームで押される物体 + 余裕
max_missed: 8                # 2 秒（8 フレーム）見えなければ追跡を消す
# 新しく現れた追跡（VLM で分類していない塊）の種類を長辺で決める閾値。LEGO 32 mm とミニカー 65 mm の間
toy_car_min_length_m: 0.048
