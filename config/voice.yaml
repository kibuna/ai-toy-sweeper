# 音声入力。MacBook（現場、CPU）のクライアントと、RTX 3090 の PC のサーバーの両方が読む。
# 2026-10-16 作成。音声はすべて pyopenjtalk の合成音声（scripts/make_voice_fixtures.py）でしか確かめていない。
# 実際の部屋の雑音・子どもの声・マイクでの値は未検証。

# 認識する言語。Whisper の言語の自動判定は使わない（短い発話「ロボット」で他言語と誤判定されうるため、明示する）。
# 指示は日本語を前提にする（英語の指示は data/vlm_eval にあるが、音声では対象外）。比較は未実施
language: ja

audio:
  # Whisper の入力は 16 kHz（モデルの前処理の仕様）。Silero VAD も 16 kHz に対応。本番のマイクもこの値で開く
  sample_rate_hz: 16000
  # 1 フレームの長さ。Silero VAD（v6）は 16 kHz で 512 サンプル（32 ms）ずつ受け付ける（モデルの仕様で、選べない）
  frame_ms: 32

vad:
  # VAD は Silero VAD（v6、faster-whisper に同梱の onnx、開発機の CPU で 1 フレーム（32 ms 分）0.25 ms）。
  # 2026-10-16 に webrtcvad（強さ 0〜3）と比べた。webrtcvad はどの強さでも
  # 白色雑音の先頭 3〜4 フレームを音声と判定して区間を開き、-20 dBFS の白色雑音は全フレームを音声と判定した。
  # Silero は -50〜-20 dBFS の白色雑音で誤検出 0、合成音声の発話はすべて取れた。実際の部屋の雑音での比較は未実施
  #
  # 「音声」とみなす確率の閾値。Silero VAD の既定（get_speech_timestamps の threshold）の 0.5 を明示して使う。
  # 合成音声の発話中は 0.99 前後、雑音は最大 0.13 で、どちらとも大きく離れている。他の値との比較は未実施
  threshold: 0.5
  # 発話の始まりとみなすのに要る、連続した「音声」フレームの長さ（3 フレーム）。単発の物音で区間を開かないため。値は未検証
  start_speech_ms: 96
  # この長さ「音声でない」フレームが続いたら発話の終わりとする。合成音声の読点・句点の間が約 510 ms
  # （「ロボット、赤いレゴを…」「集めて。レゴは…」）で、それより長くして一つの指示を途中で切らない（frame_ms の倍数）。
  # 長いほど、話し終えてから反応するまでが遅れる（停止語もこの分だけ遅れる）。人の話し方での比較は未実施。要検証
  end_silence_ms: 704
  # 発話の始まりの前に含める長さ。VAD は語頭の弱い子音で遅れて立ち上がるので、語頭が欠けないように足す。値は未検証
  pre_roll_ms: 320
  # 1 つの発話の上限。超えたら区間を閉じて「長すぎる」として扱う（指示ならサーバーに送らず言い直しを頼む）。
  # 黙って切り詰めた音声をサーバーに送らない。評価データの最長の指示（「赤いレゴを右上に、青いレゴを左下に…」）の
  # 合成音声が、遅い読み（0.85 倍）で約 5.2 s で、その 2 倍弱。Whisper の 1 回の入力窓（30 s）にも収まる。
  # 人の話し方での比較は未実施
  max_utterance_s: 10.0

wake:
  # ウェイクワードと停止語の検出に使う小さい Whisper（faster-whisper、CPU）。各 VAD 区間を書き起こして語を探す試作。
  # 2026-10-16 に tiny / base / small を合成音声のフィクスチャで比べた。
  # tiny は単独の「ロボット」を「やばった」と書き起こし、下のヒントや編集距離でも救えない。small は base の 3 倍遅い
  # （区間 1 つ 1.8 s と 0.54 s、中央値、開発機の CPU 4 スレッド、PPO の学習が並走）。精度と速さの釣り合いで base。
  # 実際の声での比較は未実施。将来は専用のキーワード検出器に置き換える
  model: base
  # CPU での量子化。faster-whisper の README の CPU の例は int8。float32 との比較は未実施
  compute_type: int8
  # CPU のスレッド数。faster-whisper の既定（0 = CTranslate2 任せ）に任せず明示する。MacBook の性能コア数（4 以上）を想定。
  # 計測は開発機（WSL2、PPO の学習が並走）で行い、結合試験では学習を妨げないよう scripts/voice_client.py の
  # --cpu-threads 2 で上書きした。MacBook での値の比較は未実施。要検証
  cpu_threads: 4
  # ビーム幅。faster-whisper の既定は 5。語の有無を見るだけなので速さを優先して 1。5 との比較は未実施
  beam_size: 1
  # faster-whisper の hotwords（書き起こしの前に与える語のヒント）。空文字ならヒントなし。
  # 2026-10-16 に「ロボット」をヒントにした場合と比べた（下の wake_max_edits の表）。
  # ヒントがあると「ボート」「ロボ」まで「ロボット」と書き起こされる。ヒントなし + 編集距離 1 にした
  hotwords: ""
  # ウェイクワード。書き起こしを正規化（NFKC、ひらがな→カタカナ、記号と空白を除く、小文字化）してから探す。
  # 「robot」は Whisper が外来語を英語で書き起こす場合のため（合成音声の比較では起きなかった）
  wake_words: ["ロボット", "robot"]
  # ウェイクワードの照合で許す編集距離（正規化後の文字単位、部分文字列との距離）。
  # 単独の「ロボット」が、区間の切れ目しだいで「ラボット」「レボット」と書き起こされた（前に雑談があると変わる）。
  # 2026-10-16、合成音声（話し方 5 通り × 前の無音 4 通り + 前に雑談）で比べた（base、温度 0 固定）。
  # 「ロボット」「ねえロボット」「ロボットさん」75 件と、紛らわしい語 175 件:
  #   hotwords なし・距離 0: 検出 35/75、誤検出 0/175
  #   hotwords なし・距離 1: 検出 71/75、誤検出 25/175（すべて「ロケット」）   ← 採用
  #   hotwords あり・距離 0: 検出 64/75、誤検出 16/175（「ボート」5、「ロボ」11）
  #   hotwords あり・距離 1: 検出 75/75、誤検出 49/175
  # ウェイクワードのない指示 59 区間の誤検出は 4 通りとも 0。検出の多さを優先した。「ロケット」と言うとウェイクする
  # （既知の誤検出。誤ってウェイクしても、次の発話が実行できる指示でなければサーバーの検証で止まる）。実際の声では未検証
  wake_max_edits: 1
  # 停止語。ウェイクワードなしで、どの状態でも見つけたらすぐ on_stop を呼ぶ（サーバーに送らない）。
  # 停止語はウェイクワードより優先する。実運用では専用のキーワード検出器にすべき（反応の遅れ）
  stop_words: ["止まって", "とまって", "止まれ", "とまれ", "ストップ", "stop"]
  # ウェイクワードの後ろに、この文字数（正規化後）以上の書き起こしがあれば、同じ区間に指示も入っているとみなす
  # （「ロボット、赤いレゴを右上に片付けて」を一息で言った場合）。実行できる最短の指示「レゴを左上へ」が 6 文字で、
  # 「です」「お願い」（4 文字）などの付け足しを指示とみなさないよう 5 にした。値は未検証
  min_command_chars: 5
  # ウェイクワードの後、この秒数以内に始まった発話だけを指示として扱う。過ぎたら待ち受けに戻る
  # （ずっと後の無関係な発話を指示として送らないため）。値は未検証
  command_timeout_s: 8.0

server:
  # 指示の書き起こし（RTX 3090）。2026-10-16 に large-v3-turbo と kotoba-whisper-v2.0 を、合成音声の指示 57 件
  # （19 文 × 話し方 3 通り）で比べた（scripts/eval_voice_asr.py）。
  # CER 0.008 / 0.009、VLM まで通して正しい 55 / 57 で同じ（誤りは両方とも「レゴ」→「デゴ」で、検証で止まる側）。
  # 書き起こしの時間は中央値 0.20 s / 0.15 s で kotoba が速いので kotoba にした（日本語専用に蒸留したモデル）。
  # 精度の差は 57 件では区別できない。
  # 2026-10-18、子どもの声の録音 4 件（talk_sim の記録）で large-v3 に替えた。
  # 出てきそうな言葉（asr_prompt）を渡したとき、large-v3 は 4 件とも意味の通る文（「黄色のレゴを左上に運んでください」）、
  # kotoba は 4 件とも崩れた（「木ののネグを」「黄色いレイレコを」「いいいい笑顔を一人上に」）。kotoba は prompt を
  # 渡しても書き起こしがほぼ変わらなかった。large-v3-turbo は 3 件、prompt なしの large-v3 は 1 件。
  # 書き起こしの時間は中央値 0.92 s（kotoba 0.17 s）。4 件だけで、正解の文は話者に未確認
  asr_model_id: openai/whisper-large-v3
  # 両モデルのモデルカードの GPU の例は float16。RTX 3090 は fp16 対応。bf16 との比較は未実施
  asr_dtype: float16
  # ビーム幅。transformers の Whisper の既定（貪欲法）に任せず明示する。速さを優先して 1。比較は未実施
  asr_num_beams: 1
  # 生成の上限。10 s の日本語は 60 文字前後（100 トークン前後）の見込みで、その 2 倍。上限に達したら
  # 「書き起こしが繰り返しに陥った」として ok: false を返す（黙って途中までを使わない）。値は未検証
  asr_max_new_tokens: 200
  # 受け付ける音声の上限。Whisper の入力窓が 30 s で、それを超えると 1 回では書き起こせない。超えたら 400 を返す
  max_audio_s: 30.0
  # 書き起こしの前に Whisper に渡す、この場面で出てきそうな言葉（prompt。前の発話として扱われ、語の選び方が寄る）。
  # 2026-10-18、子どもの声で「くろい」→「グロい」、「レゴ」→「レコ」と書き起こされた。
  # 渡す言葉は指示に出る語（色、レゴ、車、ミニカー、方向）。効果の比較は子どもの声の録音（talk_sim の記録）で行う（未検証）
  asr_prompt: "赤、青、黄色、緑、白、黒のレゴ、ブロック、車、ミニカーを、右上、左上、右下、左下に片付けて。"

client:
  # サーバーへの 1 回の要求の待ち時間の上限。VLM の指示 1 件が 3〜4 s、書き起こしが 1 s 未満で、
  # その 10 倍以上。超えたら例外にする。値は未検証
  request_timeout_s: 60.0
  # macOS の say コマンドの声と速さ。Kyoko は macOS 標準の日本語の声。速さ（語/分）は say の既定に任せず明示する。
  # 開発機が Linux のため、MacBook での聞き取りやすさは未確認。要検証
  say_voice: Kyoko
  say_rate_wpm: 180
