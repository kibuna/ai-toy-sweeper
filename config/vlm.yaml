# VLM（指示の構造化、物体の分類）。
# 2026-10-16 に 2B / 4B / 8B を比較。合成画像の物体分類が 112/112 で、指示も 8B と同等の 4B にした。
# 推論時間は 3 つとも指示 1 件 3〜4 秒で差が小さい（生成が CPU 側の処理で律速）。実画像での比較は未実施
model_id: Qwen/Qwen3-VL-4B-Instruct
dtype: bfloat16                       # モデルカードの推奨。RTX 3090 は bf16 対応。VRAM は 2B で 4.0 GiB
# 生成の上限。指示の JSON は 100 トークン前後、物体の分類は 30 トークン前後の見込み。その 5 倍以上を取り、
# 上限に達したら「打ち切られた」として例外にする（黙って途中までの出力を使わない）。上限の比較は未実施
max_new_tokens_instruction: 512
max_new_tokens_object: 128
# 構造化出力の再現性のため貪欲法。モデルカードの推奨はサンプリング（temperature 0.7, top_p 0.8）で、比較は未実施
do_sample: false
# 物体の切り出しの余白（外接矩形の各辺に足す画素）と、VLM に渡す画像の一辺。切り出しが小さすぎると
# 色や形が読めないため拡大する。値は未検証
crop_margin_px: 12
crop_size_px: 224
# 指示を受けたときの物体の同定（音声サーバーの /identify）。比較
# （合成画像 30 枚 252 個、10 色、2026-10-18）:
#   crops: 1 個ずつ聞く。245/252、盤面 1 枚（8.4 個）14.1 s
#   grid: 切り出しを番号つきのマスに並べた 1 枚で 1 回。236/252、18.8 s（長い JSON の生成で遅く、マスが小さく緑と黄緑を取り違えた）
#   batch: 1 個ずつの問い合わせを 1 回の generate にまとめる（GPU で並べて生成）。245/252、2.2 s → これを使う
#   間違いの多くは黒いミニカーを水色と答えるもの（3 方式とも同じ）
identify_mode: batch
batch_size: 16                # batch で 1 回に聞く個数の上限（未検証）
# grid で 1 回に聞く個数の上限（超えたら分けて聞く）。4 × 4 マス、224 px で 896 px 四方（未検証）
grid_max: 16
max_new_tokens_grid: 1024     # 1 個 約 25 トークン × 16 個の 2 倍以上
