# 幾何計画の基準 Policy（toy_sweeper.planner）の設定。
# すべて 2026-10-17 に 2D シミュレータ（v9 の盤面、開発用 Seed 10000〜10099）で決めた値。本番（実機）では
# 追跡のずれ・遅延があり、成り立つかは未検証。
# 「比較あり」は 2D シミュレータで他の値と比べた記録がある値。それ以外は「未検証」。

grid:
  # 占有格子の一辺。LEGO の短辺 15.8 mm の約 1/3。格子の量子化による判定のずれは ±2.5 mm で、hard_margin_m で吸収する。
  # C-space 1 枚（224 × 224）の膨張が約 1 ms で、毎ステップ数枚作れる大きさ。4 mm / 10 mm との比較は未検証
  resolution_m: 0.005
  # C-space を作る向きの刻みの数（72 = 5°）。爪の先端（車軸から約 10 cm）で ±4.4 mm のずれ。旋回 1 回（14.3°）の
  # 掃引を 3〜4 枚で確かめられる。36 / 144 との比較は未検証
  heading_bins: 72

search:
  # 探索の重複判定の格子（位置）。1 前進 2 cm の半分。細かいほど探索が重くなる。比較は未検証
  cell_m: 0.01
  # 重み付き A* の重み（1 で最適）と、それぞれの展開数の上限。順に試し、上限に当たったら次の（欲張りな）重みで探し直す。
  # 上限をすべて超えたら「計画失敗」として記録し、その対象を一時的に外す（黙って縮めない）。2026-10-17、重み 1.5・上限
  # 12,000 の 1 段では、成功した計画の展開数が中央値 35、99% 点 6,300、最大 10,600 で上限が効いていた。回り道の要る盤面
  # （Stage 6 Seed 10063）は重み 1.5 で 34,000 展開（2.1 秒）、2.0 で 14,750、3.0 で 2,331（経路は 64 → 77 行動）。
  heuristic_weights: [1.5, 3.0]
  max_expansions: [4000, 20000]
  # 後退 1 回の追加コスト（行動 1 回 = 1）。前進と同じ時間がかかるので小さくした。カメラは俯瞰なので後ろも見える。未検証
  backward_extra_cost: 0.2
  # 障害物の soft_margin_m 以内を通る 1 ステップの追加コスト。接触しそうな経路を避けさせる。未検証
  soft_cost: 0.6
  # 計画の開始時に車体と重なっている物体（離した直後の LEGO、押した直後のミニカーなど）は、通れない障害物にすると
  # どこへも動けないので、重なる 1 ステップごとにこのコストを足す（抜け出す向きを選ばせる）。未検証
  overlap_cost: 6.0
  # 目標の直線の横 ±lateral_shift_max_m にいる姿勢からは、横ずらし（旋回 k 回・前進・逆に旋回 k 回）で直線に乗る
  # （policy._with_lateral_shift）。格子の A* が重複判定で横の細かい位置を失うのを補う。旋回 1 回なら 1 前進で横 4.9 mm、
  # 2 回なら 9.6 mm。2 cm = 旋回 1 回で 4 前進。比較は未検証
  lateral_shift_max_m: 0.02
  lateral_shift_turns: [1, 2]
  # ヒューリスティックの 2D の距離場（障害物を避けた車軸中点の最短距離）で、障害物（hard_margin_m で膨らませた外形と壁）から
  # これ以上離れた所だけを通す。車体の幅の半分 42.7 mm より小さいので、通れる隙間を塞がない（下限になる）。
  # 2026-10-17、障害物を見ないヒューリスティックでは、回り道の要る盤面で展開数の上限に当たった（Stage 6 Seed 10063）。未検証
  heuristic_clearance_m: 0.035

margins:
  # 障害物の外形を膨らませる量（通れない領域）。格子の量子化（±2.5 mm）と向きの刻み（±4.4 mm、先端）を吸収する。未検証
  hard_margin_m: 0.004
  # これ以内は通れるが soft_cost を足す。1 前進 2 cm。未検証
  soft_margin_m: 0.02
  # 挟む・押す直前の、物体へ真っすぐ進む部分（接近の残り 10 cm 以内）だけの膨らませ量。0 = 外形どうしが重ならなければ通す。
  # 2026-10-17、くっついて置かれた対象（隙間 0〜5 mm）は、開いた爪の先が隣から 6 mm 離れて挟めるのに、hard_margin_m と
  # 格子の量子化で挟む姿勢が全部ふさがれた（Stage 6 Seed 10029）。隣を数 mm 押すのは失敗の判定（20 cm）に比べ小さい。未検証
  tail_margin_m: 0.0

held:
  # 「持っている」とみなす範囲（閉じた爪の中心線から左右）。task.yaml observation.held_lateral_tolerance_m と同じ 12 mm
  # （LEGO 短辺の半分 8 mm より少し大きい）。観測した位置だけから判定する（Sim2D の把持状態は読まない）。未検証
  lateral_tol_m: 0.012

grasp:
  # 挟みに行く直線上とみなす横ずれ。2D の把持の判定（開いた爪の内側 ±28.8 mm）より十分狭く、実物の爪でも中心に寄る範囲。未検証
  approach_lateral_tol_m: 0.006
  # 閉じる条件: 物体中心が「開いた爪の梁の間」の前後の範囲（2D の把持の判定。robot_model から求めると車軸から
  # 75.6〜92.9 mm）の両端からこれだけ内側、左右 close_lateral_tol_m 以内（2D の判定は梁の内側 ±15〜29 mm。
  # 8 mm では押した物体が横に 1 cm ずれて閉じられず押し続けた、Stage 6 Seed 10089）。接近は物体を爪の付け根の V に軽く当てて
  # 止める（LEGO はどの向きでも中心 84〜88 mm で当たり、範囲に入る）。2026-10-17、最初は爪の中央 ±10 mm を窓にして、
  # 梁の先（92.9 mm）より前で閉じて挟み損ね続けた（Stage 5 Seed 10007）。1.5 mm は姿勢の量子化の余裕で、未検証
  close_x_inset_m: 0.0015
  close_lateral_tol_m: 0.012
  # 同じ物体で続けて挟み損ねたら、その物体をしばらく外す回数。未検証
  max_failures: 2
  # 対象に接している物体（外形の隙間がこれ以内）は、挟む直前の直進で押しのけてよい（盤面の cluster_gap_m 0〜5 mm の
  # くっついた配置）。2026-10-17、隣のミニカーが爪の開く範囲に入り、どの向きからも挟めなかった（Stage 6 Seed 10038）。
  # 押しのける量は数 mm〜1 cm で、失敗の判定（20 cm）より十分小さい。未検証
  neighbor_gap_m: 0.008
  # 押しのけてよいのは爪だけで（車体は当てない）、その対象外がまだこれ未満しか動いていないとき。2026-10-17、
  # 制限なしでは車体が隣を押し続け、挟み直すたびに動かして 20 cm を超えた（Stage 6 Seed 10089, 10025）。20 cm の 4 割。未検証
  neighbor_max_displacement_m: 0.08
  # 挟む直前に、爪の付け根の V に当てた対象を前へ押してよい量の上限（1 前進 2 cm の後に止まれない分 + 余裕）。実際の上限は
  # 対象の前の空き（壁・他の物体まで）と小さい方。2026-10-17、壁から 5 mm の LEGO を押し込んで回し、挟めなくなった
  # （Stage 5 Seed 10010）ため、前の空きで制限した。値は未検証
  max_push_m: 0.03
  # ミニカーもまず挟みに行き（車軸の向きから、なす角 toy_car_max_rel_angle_rad 以内で差し込み、爪の付け根に当たったら閉じる）、
  # 挟み損ねが max_failures 回続くか、挟みに行く接近がふさがっていれば押す。2026-10-17 に比べた。2D の把持の判定ではミニカーの中心が
  # 梁の間に入らず挟めない（98 通り全滅、test_toy_car_cannot_be_grasped_in_2d）。既定は押すだけ
  toy_car_first: false
  # 差し込む向きと車軸のなす角の上限（縦向きに差し込む）。押すときの「なす角 0.3 rad 以下は転がって逃げる」範囲。未検証
  toy_car_max_rel_angle_rad: 0.3
  # 直線の接近を始める位置（物体中心の前方距離）の、物体に触れる距離からの追加の上限。未検証
  approach_extra_m: 0.10

drop:
  # 置き場所の条件（ゴール内）: 物体の外接円がゴールの縁からこれ以上内側。1 前進の半分（置いた後の押されに余裕）。未検証
  goal_edge_margin_m: 0.01
  # 置き場所の、他の物体（外形）からの空き。広い順に試し、置ける場所が無ければ次へ（使った段階はログに残す）。
  # 0.02 は開いた爪の外側（±36 mm）が隣の物体に当たらない程度。比較は未検証
  object_clearance_m: [0.025, 0.012, 0.004]
  # 対象をゴールに置く順: 各空きの段階で、まずゴールの縁から edge_band_m 以内の帯（物体の外接円 + goal_edge_margin_m の
  # 内側）を試し、無ければ全体。2026-10-17、置ける所の最寄りに置くと 17 cm 四方のゴールに 4 個が散らばり、5 個目の置き場が
  # なくなった（Stage 7 Seed 10093）。2 cm は LEGO の短辺ほど。未検証
  edge_band_m: 0.02

foreign:
  # ゴールに入った対象外を出す先: 物体の外接円がゴールからこれ以上外。盤面の goal_clearance_m（3 cm）と同じ。未検証
  out_clearance_m: 0.03
  # 出す先は初期位置からこの距離以内（失敗の判定 20 cm に 5 cm の余裕）
  max_relocation_m: 0.15
  # 出す先の、作業領域の壁からの空き（外接円から）。未検証
  wall_margin_m: 0.01

push:
  # ミニカーを押す向き: 車体の向きと押す向きのなす角がこれ以上（横向きに押す）。2026-10-17 の 2D の試験で、
  # なす角 0〜0.3 rad は 0〜8 mm の横ずれで転がって爪の外へ逃げ、
  # 0.45〜1.57 rad は爪の間に収まって 25 歩押しても安定した。境の 0.3〜0.45 に余裕を取って 0.5
  min_rel_angle_rad: 0.5
  # 横向きに押した後に落ち着く、押す向きとのなす角の範囲（同じ試験で 0.87〜1.57 rad）。2 段の押しの 2 段目の向きの見込みに使う
  settled_rel_angle_rad: [0.85, 1.5707963267948966]
  # 2 段の押し（1 本でゴールまで押せないとき、短く押して向きを変えてから押し直す）の 1 段目の距離の候補と、
  # 2 段目の向きに求めるなす角の余裕（見込みの範囲のどこでも min_rel_angle_rad + これ以上）。未検証
  via_lengths_m: [0.04, 0.08, 0.12, 0.16, 0.2]
  via_rel_angle_extra_rad: 0.1
  # 1 つの仕事で 2 段の押しを使う回数の上限（繰り返しても入らない盤面で時間を使い切らない）。未検証
  max_via: 3
  # 端を押して回す（1 本でも 2 段でもゴールへ押せないとき。横向きに押してもミニカーの向きはほとんど変わらないので、車軸の
  # 向きにゴールがあると押す直線が無い）。車軸と押す向きのなす角 pivot_min_rel_angle_rad 以上で、ミニカー中心を中心線から
  # 横 pivot_offset_m に置き pivot_steps 回押す。2026-10-17 の 2D の試験（なす角 π/2）で、
  # 横 35 mm / 45 mm、5 回で +0.7 / +1.3 rad 回って止まった（15 mm では 0.4 rad、25 mm では逆に 0.7 rad）。比較は未検証
  pivot_offset_m: 0.04
  pivot_steps: 5
  pivot_min_rel_angle_rad: 1.2
  max_pivot: 2
  # 押している間のミニカーの占める範囲（車軸から前方 disc_x_m の円、半径は外接円 + disc_extra_m）。
  # 2D の試験で押している間のミニカー中心は前方 100〜108 mm、横 ±16 mm に収まった
  disc_x_m: 0.105
  disc_extra_m: 0.012
  # 押し込む先: ミニカーの外接円がゴールの縁からこれ以上内側に入るまで押す。押した後の回転（横ずれ ±16 mm）に余裕。未検証
  goal_margin_m: 0.012
  # 押し始める位置（ミニカー中心の前方距離）の、接触位置からの追加の上限と、押す経路の衝突判定の刻み。未検証
  approach_extra_m: 0.08
  sweep_step_m: 0.01
  # 1 回の直線押しの上限（作業領域の対角 1.13 m より短い 1 m）。0.6 m では遠いゴールへの直線が切れた（Stage 4 Seed 10007）
  max_push_m: 1.0
  # 押している最中とみなす範囲: ミニカー中心が接触位置から前後 [−15, +25] mm、左右 30 mm 以内。2D の試験の値の範囲。未検証
  contact_x_window_m: [-0.015, 0.025]
  contact_lateral_tol_m: 0.03
  # 押す直線上とみなす横ずれ（接近の終わり）。1 cm で縦向きは逃げるが、横向きは安定した。未検証
  approach_lateral_tol_m: 0.008

replan:
  # 前の計画を続けてよい、予測した姿勢と観測の差。1 前進の実測 19.3〜20 mm（2D）と予測 20 mm の差の 4 倍弱。未検証
  pose_tol_m: 0.008
  yaw_tol_rad: 0.08
  # 物体がこれ以上動いたら計画を作り直す（静止物体は 2D では完全に止まる）。未検証
  object_move_tol_m: 0.002

recovery:
  # 計画に失敗した対象を候補から外す期間（ステップ）。他の対象を進めると道が開くことがある。未検証
  blocked_retry_steps: 20
  # 走行の行動を続けてこのステップ数の間、ロボットが stuck_motion_m しか動かなければ、詰まったとして計画を捨てる。未検証
  stuck_steps: 6
  stuck_motion_m: 0.004
